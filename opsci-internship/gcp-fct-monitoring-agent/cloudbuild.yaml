# Cloud Build — monitoring-agent
# gcloud builds submit --config functions/admin/gcp-fct-monitoring-agent/cloudbuild.yaml \
#   --substitutions=_COMMIT_SHA=$GITHUB_SHA --project demo-project .

substitutions:
  _COMMIT_SHA: latest

steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - >
        docker pull
        europe-west1-docker.pkg.dev/$PROJECT_ID/monitoring-agent/monitoring-agent:latest
        || true

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/monitoring-agent/monitoring-agent:latest'
      - '-f'
      - 'functions/admin/gcp-fct-monitoring-agent/Dockerfile'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/monitoring-agent/monitoring-agent:${_COMMIT_SHA}'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/monitoring-agent/monitoring-agent:latest'
      - '.'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/monitoring-agent/monitoring-agent:${_COMMIT_SHA}'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/monitoring-agent/monitoring-agent:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
