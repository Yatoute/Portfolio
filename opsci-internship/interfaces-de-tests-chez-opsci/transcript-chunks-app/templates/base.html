<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Transcript Chunks{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --surface2: #222;
      --border: #2e2e2e;
      --text: #e0e0e0;
      --text-muted: #777;
      --accent: #4f8ef7;
      --success: #4caf78;
      --warning: #f79a4f;
    }

    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .header-logo { font-size: 18px; flex-shrink: 0; }
    .header-title { font-size: 13px; font-weight: 600; color: var(--text-muted); flex-shrink: 0; }

    .btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); padding: 7px 14px; border-radius: 6px;
      cursor: pointer; font-size: 12px; white-space: nowrap;
      text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
      flex-shrink: 0;
    }
    .btn:hover { background: #2e2e2e; border-color: #555; }
    .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.danger { background: #3a1a1a; border-color: #5a2020; color: #f07070; }
    .btn.danger:hover { background: #4a2020; }

    main { padding: 0; max-width: none; margin: 0; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  </style>
</head>
<body>
<header>
  <span class="header-logo">🎙️</span>
  <span class="header-title">Transcript Chunks</span>
  {% block header_extra %}{% endblock %}
</header>

<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
