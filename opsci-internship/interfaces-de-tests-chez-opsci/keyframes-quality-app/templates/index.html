{% extends "base.html" %}
{% set active_url = "/" %}

{% block content %}
<div style="max-width: 520px; margin: 100px auto; text-align: center;">
  <div style="font-size: 48px; margin-bottom: 20px;">📸</div>
  <h2 style="font-size: 20px; font-weight: 600; margin-bottom: 8px;">Keyframes Quality Test</h2>
  <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 32px;">
    Entrez l'URL GCS d'une vidéo pour visualiser ses keyframes et comparer l'original avec la reconstruction.
  </p>
  <form method="GET" action="/keyframes" style="display: flex; gap: 8px;">
    <input type="text" name="url" placeholder="gs://your-bucket/..."
           style="flex:1; background:var(--surface); border:1px solid var(--border);
                  border-radius:8px; padding:10px 14px; color:var(--text);
                  font-size:13px; font-family:monospace;">
    <button type="submit" class="btn" style="padding: 10px 18px; font-size:13px;">→ Charger</button>
  </form>
</div>
{% endblock %}
