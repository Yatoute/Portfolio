[project]
name = "queryrewriter"
version = "0.1.0"
description = "Conversational query rewriting for scoped semantic retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.2.1",
    "openai==2.26.0",
    "pandas==3.0.1",
    "arxiv==2.4.1",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/queryrewriter"]
