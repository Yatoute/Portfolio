[project]
name = "watchagent"
version = "0.1.0"
description = " Watch Agent"
authors = [
    { name = "MINTOAMA Yatoute" }
]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "python-dotenv==1.2.1",
    "opencv-python==4.13.0.92",
    "ollama>=0.4.0",
]

[project.optional-dependencies]
api = [
]
ui = [
]
dev = [
    "ipykernel",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchagent"]
