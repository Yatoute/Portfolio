[project]
name = "chatpdf"
version = "0.1.0"
description = "Agentic PDF RAG system with OCR and semantic retrieval"
authors = [
    { name = "MINTOAMA Yatoute" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "python-dotenv==1.2.1",
    "langchain==1.3.0",
    "langchain-community>=0.4.1",
    "rapidocr-onnxruntime==1.4.4",
    "rapidocr>=2.0",
    "pypdf==6.7.2",
    "langchain-openai>=1.1.3",
    "langchain-ollama>=1.0.1",
    "faiss-cpu==1.13.2",
    "langgraph==1.2.10",
    "langgraph-prebuilt==1.1.0",
    "pymupdf==1.27.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.134.0",
    "python-multipart==0.0.9",
    "uvicorn==0.41.0",
    "slowapi>=0.1.9",
]
ui = [
    "streamlit>=1.33.0",
    "requests>=2.31.0",
]
dev = [
    "ipykernel",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatpdf"]

[project.scripts]
chatpdf-api = "chatpdf.api.main:run"
chatpdf-ui = "chatpdf.ui.app:run"
