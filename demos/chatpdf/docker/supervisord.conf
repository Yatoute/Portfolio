[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/tmp/supervisord.log
logfile_maxbytes=0
loglevel=info

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:api]
command=python -m uvicorn chatpdf.api.main:app --host %(ENV_CHATPDF_API_HOST)s --port %(ENV_CHATPDF_API_PORT)s
autostart=true
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:ui]
command=python -m streamlit run src/chatpdf/ui/app.py --server.address %(ENV_CHATPDF_UI_HOST)s --server.port %(ENV_CHATPDF_UI_PORT)s
autostart=true
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0